[package]
name = "hermesmq-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
prost = "0.13"
bytes = "1"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
openraft = { version = "=0.9.25", features = ["serde", "storage-v2", "loosen-follower-log-revert"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "io-util"] }

hermesmq-proto = { path = "../crates/hermesmq-proto" }
hermesmq-core = { path = "../crates/hermesmq-core" }

# Detached from the parent workspace so `cargo build/test` and the stable-pinned
# CI never try to compile this nightly-only crate.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "request_decode"
path = "fuzz_targets/request_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "response_decode"
path = "fuzz_targets/response_decode.rs"
test = false
doc = false
bench = false

